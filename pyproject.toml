[project]
name = "fee-refund-agent"
version = "0.1.0"
description = "Agentic flow that prepares overdraft-fee refund cases for credit union staff."
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "langgraph>=1.0",
    "limits>=5",
    "openai>=3.24",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "sse-starlette>=3.5",
    "structlog>=24.4",
    "typesafe-sdk>=0.7.2",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["backend", "tests"]
# tests/ has no __init__.py files: name every module by its path from the repo root.
explicit_package_bases = true
mypy_path = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
# Smart App Control on the dev machine blocks mypy's compiled (mypyc) extension; the pure-Python build is equivalent, only slower.
no-binary-package = ["mypy"]
