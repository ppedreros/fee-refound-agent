# The whole agent run (docs/agent-design.md §5). Changing it is an "ask first" change.
# Every model and tool call inside the run gets the remaining time as its deadline (D-agent-6).
timeout_s: 45
# Model calls get the run's remaining time minus this reserve, so when one hangs, its fallback
# (the template, `classifier_down`) and the rest of the run still finish inside the timeout.
fallback_reserve_s: 3
