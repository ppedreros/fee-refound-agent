# Alembic config. Run from the repo root:
#   uv run python -m alembic -c backend/db/alembic.ini upgrade head
# Migrations run as the owner (OWNER_DATABASE_URL), or on a connection passed in by bootstrap and
# tests. No logging sections here: the app's JSON logging stays in charge.

[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
